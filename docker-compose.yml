version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: bodega_mongodb
    restart: always
    ports:
      - "127.0.0.1:27021:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - bodega_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bodega_backend
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - MongoDbSettings__ConnectionString=mongodb://mongodb:27017
      - MongoDbSettings__DatabaseName=BodegaDebtsDb
    ports:
      - "5086:5086"
    depends_on:
      - mongodb
    networks:
      - bodega_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bodega_frontend
    restart: always
    ports:
      - "${PORT:-8088}:80"
    depends_on:
      - backend
    networks:
      - bodega_network

volumes:
  mongo_data:
    driver: local

networks:
  bodega_network:
    driver: bridge
