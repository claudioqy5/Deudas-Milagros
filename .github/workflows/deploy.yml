name: Deploy to VPS

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Despliegue en VPS Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Ejecutar despliegue vía SSH en AlmaLinux VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script_stop: true
          script: |
            set -e
            TARGET_DIR="/var/www/deudas-milagros"
            REPO_URL="https://github.com/claudioqy5/Deudas-Milagros.git"

            echo ">>> [1/5] Verificando instalación de Docker..."
            if ! command -v docker &> /dev/null; then
              echo "Instalando Docker..."
              curl -fsSL https://get.docker.com | sh
              systemctl enable --now docker
            fi

            # Detectar comando de docker compose
            if docker compose version &> /dev/null; then
              DOCKER_COMPOSE="docker compose"
            elif command -v docker-compose &> /dev/null; then
              DOCKER_COMPOSE="docker-compose"
            else
              echo "Instalando plugin docker-compose..."
              mkdir -p /usr/local/lib/docker/cli-plugins
              curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
              chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
              DOCKER_COMPOSE="docker compose"
            fi

            echo ">>> [2/5] Preparando directorio del proyecto en $TARGET_DIR..."
            mkdir -p /var/www
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "Clonando repositorio..."
              rm -rf "$TARGET_DIR"
              git clone "$REPO_URL" "$TARGET_DIR"
              cd "$TARGET_DIR"
            else
              echo "Actualizando a la última versión..."
              cd "$TARGET_DIR"
              git reset --hard
              git pull origin master || git pull origin main
            fi

            echo ">>> [3/5] Reconstruyendo y levantando contenedores..."
            $DOCKER_COMPOSE down --remove-orphans || true
            $DOCKER_COMPOSE up -d --build

            echo ">>> [4/5] Estado de los servicios desplegados:"
            $DOCKER_COMPOSE ps

            echo ">>> [5/5] Limpiando imágenes y cache huérfano..."
            docker image prune -f

            echo ">>> ¡DESPLIEGUE A PRODUCCIÓN COMPLETADO EXITOSAMENTE! 🚀"
